# Blank issues stay available on purpose. The two templates here cover a bug
# and a request; a question, or a report that is neither, would otherwise have
# nowhere to go, and would arrive mis-filed as whichever template was closer.
#
# Note that Kari's own "Report a Bug" and "Request a Feature" buttons link
# straight to a template, so this setting only affects people who reach the
# issue list themselves.
blank_issues_enabled: true

